name: Build and deploy to GitHub Pages

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5

      - name: Set social image URL for GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const file = "src/index.html";
            const html = readFileSync(file, "utf8");
            const image = new URL("logo-alberto-maza-social.png", process.env.PAGES_URL + "/");
            const updated = html.replace(/(<meta property="og:image" content=")[^"]*(")/, (_, start, end) => start + image.href + end);
            if (updated === html) throw new Error("Open Graph image tag was not updated");
            writeFileSync(file, updated);
          '

      - name: Build production site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/"

      - name: Verify static output
        run: test -f dist/dpdlanding/browser/index.html

      - name: Upload build for pull request review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dpd-landing-artifact
          path: dist/dpdlanding/browser
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/dpdlanding/browser

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
